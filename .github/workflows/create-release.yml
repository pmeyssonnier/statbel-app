name: Créer une release

# Crée une release GitHub pour un tag existant, avec les notes tirées du
# CHANGELOG.md (section de la version). Déclenchement MANUEL : onglet Actions →
# « Créer une release » → Run workflow.
#   - avec « tag »  : crée/met à jour la release de ce tag (ex. v3.14).
#   - sans « tag »  : backfill de TOUTES les releases manquantes (tags v3.*).
# Idempotent : une release existante voit seulement ses notes rafraîchies.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag unique (ex. v3.14). Vide = backfill de toutes les releases v3.* manquantes."
        required: false

permissions:
  contents: write   # créer/éditer une release via GITHUB_TOKEN

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Créer / mettre à jour la (les) release(s) depuis le CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e

          # Notes = section « ## [X.Y] … » du CHANGELOG jusqu'au prochain titre « ## »
          notes_for() {
            local ver="${1#v}"
            # S'arrête au prochain titre « ## » OU à une règle horizontale « --- »
            # (évite d'embarquer le séparateur qui suit la dernière version).
            awk -v h="## [$ver]" 'index($0,h)==1{f=1;next} f && (/^## / || /^---[[:space:]]*$/){exit} f{print}' CHANGELOG.md
          }

          make_release() {
            local t="$1"
            if ! git rev-parse -q --verify "refs/tags/$t" >/dev/null; then
              echo "::warning::tag $t absent → ignoré"; return
            fi
            notes_for "$t" > /tmp/notes.md || true
            if gh release view "$t" >/dev/null 2>&1; then
              if [ -s /tmp/notes.md ]; then
                gh release edit "$t" --title "$t" --notes-file /tmp/notes.md
                echo "↻ notes de $t réécrites depuis le CHANGELOG"
              else
                echo "::warning::$t : aucune section « ## [${t#v}] » dans le CHANGELOG → notes inchangées"
              fi
            elif [ -s /tmp/notes.md ]; then
              gh release create "$t" --title "$t" --notes-file /tmp/notes.md; echo "✓ créé $t"
            else
              # Repli visible : sans section dans le CHANGELOG on retombe sur les
              # notes auto de GitHub, mais on le signale (une section oubliée est
              # sinon indétectable dans le log).
              gh release create "$t" --title "$t" --generate-notes
              echo "::warning::$t : aucune section « ## [${t#v}] » dans le CHANGELOG → notes auto-générées"
            fi
          }

          if [ -n "$TAG" ]; then
            # Normalise la saisie manuelle : « V3.8 » ou « 3.8 » → « v3.8 »
            # (les tags git sont sensibles à la casse).
            TAG="v${TAG#[vV]}"
            make_release "$TAG"
          else
            echo "Backfill des releases pour les tags v3.*"
            for t in $(git tag -l 'v3.*' | sort -V); do make_release "$t"; done
          fi
