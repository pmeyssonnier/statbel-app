name: Tests headless

# Lance le harnais de non-régression (tests/*.test.js) sur chaque push et PR.
# L'APP reste 100% statique sans build ; le package.json ne porte QUE l'outillage
# de dev (playwright + eslint). Les tests sont des scripts node autonomes qui
# servent le dépôt sur un port éphémère (tests/_serve.js) et pilotent l'app dans
# un vrai Chromium.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint « prudent » : bugs uniquement (vars/imports inutilisés, no-undef via le
  # pont window déclaré, clés dupliquées, code mort). Pas de style, pas de Prettier.
  # --max-warnings 0 : la base est propre, on empêche toute nouvelle dérive.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Installer les devDependencies
        run: npm install
      - name: ESLint (0 erreur, 0 avertissement)
        run: npm run lint

  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Installer les devDependencies
        run: npm install
      # Le navigateur + ses dépendances système (le pretest de npm ne pose que le
      # navigateur ; ici on ajoute --with-deps pour le runner CI).
      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: Lancer la suite headless
        run: npm test

  # Garde du rituel de version : sur une PR, si un fichier servi change sans bump
  # de CACHE (sw.js), ou si un nouveau fichier servi manque dans sw.js → échec.
  version-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Vérifier CACHE + APP_CRITICAL
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/check-version-bump.js "$BASE_SHA"
