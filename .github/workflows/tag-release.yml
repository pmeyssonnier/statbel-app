name: Créer un tag de version

# Pose un tag de version depuis GitHub (le git push local est parfois bloqué par
# un proxy). Déclenchement MANUEL : onglet Actions → « Créer un tag de version »
# → Run workflow, en donnant le tag (ex. v3.28) et, au besoin, le commit visé.
#
# LIMITE CONNUE — GITHUB_TOKEN est un jeton d'App : GitHub refuse un ref dont
# l'arbre .github/workflows/* diffère de celui de la branche par défaut
# (« refusing to allow a GitHub App to create or update workflow ... without
# workflows permission »), le bloc `permissions:` n'offre aucun scope
# `workflows`, et l'API Git Refs oppose le même 403. Taguer le sommet de main
# (le cas normal) passe toujours ; un commit antérieur à une refonte de workflow
# n'est taguable que depuis un clone (identifiants avec le scope `workflow`) ou
# avec un PAT *Contents + Workflows: write*. Cas réel resté ouvert : v3.14 —
# voir la note de sa section dans le CHANGELOG.
#
# Le backfill v3.8 → v3.27 a été retiré une fois les tags posés ; il reste dans
# l'historique (`git log -p -- .github/workflows/tag-release.yml`).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à créer (ex. v3.28)."
        required: true
      ref:
        description: "Commit ou branche cible (défaut : commit courant)."
        required: false

permissions:
  contents: write   # nécessaire pour pousser le tag via GITHUB_TOKEN

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # historique complet → le commit cible est présent

      - name: Créer et pousser le tag
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ inputs.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Normalise la saisie (les tags git sont sensibles à la casse) :
          # « V3.28 » ou « 3.28 » → « v3.28 ».
          TAG="v${TAG#[vV]}"
          target="${REF:-$SHA}"
          want=$(git rev-parse --verify -q "$target^{commit}") || {
            echo "::error::cible introuvable : $target (donne un SHA complet, une branche ou un tag)"
            exit 1
          }
          echo "$TAG → $want"

          # Un tag déjà posé n'est jamais déplacé en silence : soit il est déjà
          # au bon endroit (rien à faire), soit il faut le supprimer sciemment.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            have=$(git rev-list -n1 "$TAG")
            if [ "$have" = "$want" ]; then
              echo "::notice::$TAG existe déjà et pointe au bon endroit — rien à faire"
              exit 0
            fi
            echo "::error::$TAG existe déjà et pointe sur $have — supprime-le avant de le reposer"
            exit 1
          fi

          git tag -a "$TAG" "$want" -m "$TAG"
          if ! git push origin "refs/tags/$TAG" 2>/tmp/push.err; then
            sed 's/^/    /' /tmp/push.err
            echo "::error::$TAG non poussé — voir la LIMITE CONNUE en tête de ce workflow"
            exit 1
          fi
          echo "poussé $TAG"
